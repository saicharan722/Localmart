<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Password Recovery | LocalMart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{min-height:100vh;background:#f4f7f4;display:grid;place-items:center;font-family:Inter,Arial,sans-serif}.card{width:min(100% - 2rem,460px);border:0;border-radius:18px;box-shadow:0 12px 36px #12321a12}.brand{color:#14A94A;font-weight:800;font-size:1.4rem}.btn-local{background:#14A94A;color:#fff}.btn-local:hover{background:#118b3d;color:#fff}</style>
</head>
<body>
  <main class="card p-4 p-md-5">
    <div class="brand mb-3">LocalMart Admin</div>
    <h1 class="h3 fw-bold">Forgot Password?</h1>
    <p class="text-secondary mb-4">Enter the registered administrator email address to receive a secure reset link.</p>
    <form method="post" novalidate>
      {% csrf_token %}
      {% if form.email.errors %}<div class="alert alert-danger py-2">{{ form.email.errors|join:", " }}</div>{% endif %}
      <label class="form-label" for="{{ form.email.id_for_label }}">Email address</label>
      {{ form.email }}
      <button class="btn btn-local w-100 mt-4 py-2 fw-semibold" type="submit">Send Reset Link</button>
    </form>
    <a class="text-success text-decoration-none mt-4" href="{% url 'admin_login' %}">← Back to Admin Login</a>
  </main>
</body>
</html>
