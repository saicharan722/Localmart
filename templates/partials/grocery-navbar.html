{% load static %}
<header class="grocery-site-header">
    <div class="grocery-site-nav">
        <a class="grocery-site-logo localmart-shared-logo" href="{% url 'index' %}" aria-label="LocalMart home">
            <i class="bi bi-shop localmart-logo-icon"></i><span class="localmart-logo-word">Local</span><span class="localmart-logo-word localmart-logo-mart">Mart</span>
        </a>

        <button class="grocery-mobile-toggle" id="groceryNavToggle" type="button" aria-label="Open navigation" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>

        <form class="grocery-nav-search" id="groceryNavSearchForm" role="search">
            <input id="groceryNavSearch" type="search" placeholder="Search grocery products and categories" aria-label="Search grocery products and categories" autocomplete="off">
            <button type="submit" aria-label="Search"><i class="bi bi-search"></i></button>
        </form>

        <nav class="grocery-nav-actions" id="groceryNavActions" aria-label="Grocery navigation">
            <a class="grocery-nav-action" href="{% url 'grocery_wishlist' %}">
                <i class="bi bi-heart"></i><span>Wishlist</span><b id="wishlistCount">0</b>
            </a>
            <a class="grocery-nav-action" href="{% url 'cart' %}">
                <i class="bi bi-cart3"></i><span>Cart</span><b id="cartCount">0</b>
            </a>
            <div class="grocery-account">
                <button class="grocery-account-button" id="accountDropdown" type="button" aria-expanded="false" aria-controls="accountMenu">
                    <i class="bi bi-person-circle"></i><span>Account</span><i class="bi bi-chevron-down"></i>
                </button>
                <div class="grocery-account-menu" id="accountMenu">
                    <a href="{% url 'grocery_orders' %}"><i class="bi bi-bag-check"></i>My Orders</a>
                </div>
            </div>
        </nav>
    </div>
</header>
