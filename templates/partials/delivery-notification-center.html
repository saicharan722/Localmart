<style>
  .notification-center{position:fixed;top:12px;right:210px;z-index:30}
  .notification-trigger{position:relative;display:grid;place-items:center;width:40px;height:40px;border:1px solid #dfe7ef;border-radius:8px;background:#fff;color:#23344d;font-size:18px;cursor:pointer}
  .notification-count{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:10px;background:#d8334a;color:#fff;font-size:10px;font-weight:800;line-height:18px;text-align:center}
  .notification-popover{position:absolute;top:48px;right:0;width:min(410px,calc(100vw - 28px));max-height:min(70vh,620px);overflow:auto;border:1px solid #dfe7ef;border-radius:9px;background:#fff;box-shadow:0 14px 40px #152b451f;color:#203047}
  .notification-popover[hidden]{display:none}
  .notification-popover>header{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;border-bottom:1px solid #e8edf3;background:#fff}
  .notification-popover>header button,.notification-mark-read,.notification-mark-all{border:0;background:none;color:#087b55;font:inherit;font-size:11px;font-weight:700;cursor:pointer}
  .notification-list{display:grid}
  .notification-item{padding:12px 15px;border-bottom:1px solid #edf1f5}
  .notification-item.unread{background:#f2faf6}
  .notification-order{display:block;color:#1d2d43;text-decoration:none}
  .notification-order:hover{text-decoration:underline}
  .notification-item-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:800}
  .notification-state{color:#738197;font-size:10px;font-weight:700}
  .notification-message,.notification-details{margin:5px 0 0;color:#53647a;font-size:11px;line-height:1.5;overflow-wrap:anywhere}
  .notification-mark-read{margin-top:7px;padding:0}
  .notification-history-link{display:block;padding:12px 15px;color:#087b55;text-decoration:none;font-size:11px;font-weight:800}
  .notification-empty{margin:0;padding:18px 15px;color:#738197;font-size:12px}
  .notification-history-list{display:grid;gap:9px}
  .notification-history-list .notification-item{border:1px solid #e8edf3;border-radius:8px}
  @media(max-width:600px){.notification-center{top:61px;right:12px}.notification-popover{position:fixed;top:106px;right:10px;width:calc(100vw - 20px);max-height:75vh}.notification-trigger{width:36px;height:36px}}
</style>
<div class="notification-center" data-notification-center data-api-url="{% url 'delivery_notifications_api' %}">
  <button class="notification-trigger" type="button" aria-label="Notifications" aria-expanded="false" aria-controls="deliveryNotificationPanel">
    <i class="bi bi-bell" aria-hidden="true"></i>
    <span class="notification-count" data-notification-count hidden>0</span>
  </button>
  <section class="notification-popover" id="deliveryNotificationPanel" data-notification-panel hidden>
    <header><b>Notifications</b><button type="button" data-mark-all-read>Mark all as read</button></header>
    <div class="notification-list" data-notification-list><p class="notification-empty">Loading notifications...</p></div>
    <a class="notification-history-link" href="{% url 'partner_dashboard_page' section='notifications' %}">View notification history</a>
  </section>
</div>
