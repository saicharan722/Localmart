{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password | LocalMart Merchant</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f8f5;color:#243228;font:15px/1.5 'DM Sans',sans-serif}.reset-card{width:min(100%,460px);padding:38px;background:#fff;border:1px solid #e7eee8;border-radius:20px;box-shadow:0 18px 50px #1d3c2512}.brand{display:inline-block;margin-bottom:27px;color:#198754;font-size:25px;font-weight:800;letter-spacing:-.7px;text-decoration:none}.brand span{color:#26352a}.icon{width:48px;height:48px;display:grid;place-items:center;margin-bottom:15px;border-radius:15px;background:#eaf7ed;color:#198754;font-size:22px}.reset-card h1{margin:0 0 8px;font-size:25px;font-weight:800}.lead{margin:0 0 24px;color:#738078}.form-label{font-weight:700;font-size:13px}.form-control{padding:12px;border-color:#dbe5de;border-radius:10px}.primary{width:100%;padding:12px;border:0;border-radius:10px;background:#14a94a;color:#fff;font-weight:800}.back{display:block;margin-top:19px;color:#198754;text-align:center;text-decoration:none;font-weight:700}.field-error{margin-top:5px;color:#b42318;font-size:12px}
  </style>
</head>
<body>
  <main class="reset-card">
    <a class="brand" href="{% url 'index' %}">Local<span>Mart</span></a>
    <div class="icon" aria-hidden="true">✉</div>
    <h1>Forgot Password?</h1>
    <p class="lead">Enter the email address registered with your merchant account.</p>
    <form method="post" novalidate>
      {% csrf_token %}
      <label class="form-label" for="id_email">Email Address</label>
      {{ form.email }}
      {% for error in form.email.errors %}<div class="field-error">{{ error }}</div>{% endfor %}
      <button class="primary mt-3" type="submit">Send Reset Link</button>
    </form>
    <a class="back" href="{% url 'merchant_login' %}">← Back to Login</a>
  </main>
</body>
</html>
