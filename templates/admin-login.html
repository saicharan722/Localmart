{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Admin Login | LocalMart</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <!-- Admin Login CSS -->
    <link
        rel="stylesheet"
        href="{% static 'css/admin-login.css' %}">

</head>


<body>

{% if error %}
<div class="alert alert-danger text-center m-3" role="alert">{{ error }}</div>
{% endif %}

<div class="container-fluid">

    <div class="row min-vh-100">


        <!-- ========================= -->
        <!-- LEFT SIDE IMAGE / CONTENT -->
        <!-- ========================= -->

        <div class="col-lg-6 left-panel d-none d-lg-flex">

            <div class="overlay">

                <div class="content">

                    <h1>Welcome Administrator!</h1>

                    <p>
                        Manage merchants, products, customers,
                        orders and reports from one secure dashboard.
                    </p>

                    <img
                        src="{% static 'images/admin.jpg' %}"
                        class="img-fluid rounded-4 shadow"
                        alt="Admin Dashboard">

                </div>

            </div>

        </div>


        <!-- ========================= -->
        <!-- RIGHT SIDE LOGIN -->
        <!-- ========================= -->

        <div class="col-lg-6 d-flex align-items-center justify-content-center">

            <div class="login-box">


                <!-- Logo / Title -->

                <div class="text-center mb-4">

                    <h2 class="fw-bold text-success">

                        <i class="bi bi-shield-lock-fill"></i>

                        Admin Portal

                    </h2>

                    <p class="text-muted">

                        Administrator Login

                    </p>

                </div>


                <!-- Admin Login Form -->

                <form id="adminLoginForm" method="post" action="{% url 'admin_login' %}">
                    {% csrf_token %}


                    <!-- Username -->

                    <div class="mb-3">

                        <label class="form-label">
                            Username
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">

                                <i class="bi bi-person-fill"></i>

                            </span>

                            <input
                                type="text"
                                class="form-control"
                                id="username"
                                name="username"
                                placeholder="Enter username or email"
                                required>

                        </div>

                    </div>


                    <!-- Password -->

                    <div class="mb-3">

                        <label class="form-label">
                            Password
                        </label>

                        <div class="input-group">

                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                placeholder="Enter password"
                                required>

                            <button
                                type="button"
                                class="btn btn-outline-secondary"
                                onclick="togglePassword()">

                                <i
                                    class="bi bi-eye"
                                    id="eyeIcon">
                                </i>

                            </button>

                        </div>

                    </div>


                    <!-- Remember Me / Forgot Password -->

                    <div class="d-flex justify-content-between mb-3">

                        <div>

                            <input
                                type="checkbox"
                                id="rememberMe">

                            <label for="rememberMe">
                                Remember Me
                            </label>

                        </div>


                        
                    </div>


                    <!-- Login Button -->

                    <button
                        type="submit"
                        class="btn btn-success w-100 py-2">

                        <i class="bi bi-box-arrow-in-right"></i>

                        Admin Login

                    </button>

                </form>


                <!-- Back To Home -->

                <div class="text-center mt-4">

                    <a href="{% url 'index' %}" class="text-success fw-bold">
    <i class="bi bi-arrow-left"></i>
    Back to Home
</a>
                </div>


            </div>

        </div>


    </div>

</div>


<!-- Admin Login JavaScript -->

<script src="{% static 'js/admin-login.js' %}"></script>


</body>

</html>
