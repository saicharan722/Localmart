{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delivery Partner Login | LocalMart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root{--lm-green:#0ba454;--lm-ink:#10283a;--lm-muted:#63788b}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#f4fbf8;color:var(--lm-ink);font-family:Inter,"Segoe UI",Arial,sans-serif}
    .partner-login-page{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(440px,.9fr);background:linear-gradient(135deg,#e9f7ff,#f2fff8)}
    .partner-art{position:relative;min-height:100vh;overflow:hidden;display:flex;align-items:flex-start;justify-content:center;background:linear-gradient(145deg,#cceafa,#e9fbf3)}
    .partner-art img{display:block;width:100%;height:100vh;object-fit:contain;object-position:top center}
    .partner-form-side{display:flex;align-items:center;justify-content:center;padding:48px clamp(24px,5vw,88px)}
    .partner-login-card{width:min(100%,620px);padding:clamp(30px,4vw,62px);border:1px solid #e9f0ed;border-radius:22px;background:rgba(255,255,255,.97);box-shadow:0 24px 70px rgba(22,64,48,.12)}
    .partner-brand{display:flex;justify-content:center;align-items:center;gap:12px;margin-bottom:30px;color:#0a9b50}
    .partner-brand .brand-cart{font-size:42px;line-height:1}
    .partner-brand strong{display:block;color:#102e40;font-size:clamp(27px,3vw,40px);font-weight:800;letter-spacing:-1.5px;line-height:1}
    .partner-brand strong span{color:var(--lm-green)}
    .partner-brand small{display:block;text-align:right;color:#18374a;font-size:15px;font-weight:600;margin-top:4px}
    .partner-login-card h1{margin:0 0 8px;font-size:clamp(28px,3vw,38px);font-weight:800;letter-spacing:-.8px}
    .partner-intro{margin:0 0 30px;color:var(--lm-muted);font-size:16px}
    .partner-login-card .form-label{font-weight:650;color:#203a4d;margin-bottom:8px}
    .partner-login-card .form-control{height:58px;border:1px solid #d6e0e8;border-radius:11px;padding:12px 16px;font-size:16px;box-shadow:none}
    .partner-login-card .form-control:focus{border-color:#34b878;box-shadow:0 0 0 4px rgba(11,164,84,.12)}
    .password-wrap{position:relative}.password-wrap .form-control{padding-right:54px}
    .password-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#667b8d;padding:8px 10px}
    .remember-row{display:flex;align-items:center;gap:10px;margin:2px 0 24px;color:#183047}
    .remember-row input{width:19px;height:19px;accent-color:var(--lm-green)}
    .partner-submit{min-height:60px;border:0;border-radius:11px;background:linear-gradient(100deg,#08a451,#069d57);font-size:18px;font-weight:750;box-shadow:0 9px 20px rgba(6,157,87,.2);transition:transform .2s,box-shadow .2s}
    .partner-submit:hover{background:linear-gradient(100deg,#078c46,#078748);transform:translateY(-2px);box-shadow:0 13px 24px rgba(6,157,87,.25)}
    .partner-divider{display:flex;align-items:center;gap:16px;margin:28px 0 20px;color:#708397;font-size:14px}.partner-divider:before,.partner-divider:after{content:"";height:1px;flex:1;background:#dbe5e9}
    .partner-apply{display:flex;justify-content:center;align-items:center;gap:9px;min-height:58px;border:1.5px solid var(--lm-green);border-radius:11px;color:#07964d;font-size:17px;font-weight:700;text-decoration:none;transition:background .2s,color .2s}
    .partner-apply:hover{background:#eaf9f1;color:#067c40}
    .partner-trust{display:flex;justify-content:center;align-items:center;gap:9px;border-top:1px solid #edf1f2;margin-top:30px;padding-top:22px;color:#708397;font-size:14px}.partner-trust i{color:var(--lm-green);font-size:19px}
    .partner-back{display:block;text-align:center;margin-top:22px;color:#6b7d8a;text-decoration:none;font-size:14px}.partner-back:hover{color:#078c46}
    .auth-error{border-radius:10px}
    @media(max-width:900px){.partner-login-page{grid-template-columns:1fr}.partner-art{min-height:0;height:min(42vh,360px)}.partner-art img{width:100%;height:100%;object-fit:contain;object-position:top center}.partner-form-side{padding:30px 20px 42px}.partner-login-card{max-width:560px}}
    @media(max-width:480px){.partner-art{height:min(38vh,300px);min-height:190px}.partner-form-side{padding:22px 14px 32px}.partner-login-card{padding:27px 22px;border-radius:18px}.partner-brand{margin-bottom:24px}.partner-intro{margin-bottom:24px}.partner-login-card .form-control{height:54px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="partner-login-page">
    <section class="partner-art" aria-label="LocalMart delivery partner welcome">
      <img src="{% static 'images/delivery-partner-login-landscape.png' %}" alt="LocalMart delivery partner riding a green scooter">
    </section>
    <section class="partner-form-side">
      <div class="partner-login-card">
        <div class="partner-brand" aria-label="LocalMart Delivery Partner">
          <i class="bi bi-cart-fill brand-cart" aria-hidden="true"></i>
          <div><strong>Local<span>Mart</span></strong><small>Delivery Partner</small></div>
        </div>
        <h1>Partner Login</h1>
        <p class="partner-intro">Welcome back! Please login to your account.</p>
        {% if error %}<div class="alert alert-danger auth-error" role="alert">{{ error }}</div>{% endif %}
        <form method="post" action="{% url 'partner_login' %}">
          {% csrf_token %}
          <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email address" autocomplete="username" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <div class="password-wrap">
              <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
              <button type="button" class="password-toggle" id="togglePasswordBtn" aria-label="Show password"><i class="bi bi-eye" id="eyeIcon" aria-hidden="true"></i></button>
            </div>
          </div>
          <label class="remember-row" for="rememberMe"><input type="checkbox" id="rememberMe"> <span>Remember Me</span></label>
          <button type="submit" class="btn btn-success partner-submit w-100">Login <i class="bi bi-arrow-right ms-2" aria-hidden="true"></i></button>
        </form>
        <div class="partner-divider">New to LocalMart?</div>
        <a class="partner-apply" href="{% url 'partner_register' %}"><i class="bi bi-person-plus-fill" aria-hidden="true"></i> Create New Account</a>
        <div class="partner-trust"><i class="bi bi-shield-fill-check" aria-hidden="true"></i><span>Trusted by thousands of delivery partners</span></div>
        <a class="partner-back" href="{% url 'index' %}"><i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Back to LocalMart</a>
      </div>
    </section>
  </main>
  <script>
    document.getElementById("togglePasswordBtn").addEventListener("click", function () {
      const input = document.getElementById("password");
      const icon = document.getElementById("eyeIcon");
      const visible = input.type === "password";
      input.type = visible ? "text" : "password";
      icon.className = visible ? "bi bi-eye-slash" : "bi bi-eye";
      this.setAttribute("aria-label", visible ? "Hide password" : "Show password");
    });
  </script>
</body>
</html>
