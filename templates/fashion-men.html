{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="LocalMart Men's Fashion - Shirts, T-Shirts, Jeans, Trousers, Jackets and more."
    >

    <title>Men's Fashion | LocalMart</title>


    <!-- =========================================================
         BOOTSTRAP
    ========================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- =========================================================
         BOOTSTRAP ICONS
    ========================================================== -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <!-- =========================================================
         GOOGLE FONT
    ========================================================== -->

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- =========================================================
         FASHION MEN CSS
    ========================================================== -->

    <link
        rel="stylesheet"
        href="{% static 'css/fashion-men.css' %}"
    >

{% include "fashion-shared-style.html" %}
</head>


<body>


<!-- =========================================================
     LOCALMART NAVBAR
========================================================= -->

{% include "fashion-shared-navbar.html" %}



<!-- =========================================================
     MAIN CONTAINER
========================================================= -->

<div class="container-fluid fashion-container">


    <!-- =========================================================
         BREADCRUMB
    ========================================================== -->

    <div class="fashion-breadcrumb">

        <a href="{% url 'index' %}">
            Home
        </a>

        <i class="bi bi-chevron-right"></i>

        <a href="{% url 'fashion' %}">
            Fashion
        </a>

        <i class="bi bi-chevron-right"></i>

        <span>
            Men
        </span>

    </div>



    <!-- =========================================================
         PAGE HEADING
    ========================================================== -->

    <div class="fashion-heading-row">

        <div>

            <h1>
                Men's Fashion
            </h1>

           

        </div>

    </div>



    <!-- =========================================================
         MOBILE FILTER / SORT
    ========================================================== -->

    <div class="mobile-toolbar">


        <button
            type="button"
            class="mobile-toolbar-btn"
            id="mobileFilterBtn"
        >

            <i class="bi bi-funnel"></i>

            FILTER

        </button>


        <button
            type="button"
            class="mobile-toolbar-btn"
            id="mobileSortBtn"
        >

            <i class="bi bi-sort-down"></i>

            SORT

        </button>

    </div>



    <!-- =========================================================
         MAIN LISTING
    ========================================================== -->

    <div class="fashion-layout">


        <!-- =====================================================
             FILTER SIDEBAR
        ====================================================== -->

        <aside
            class="filter-sidebar"
            id="filterSidebar"
        >


            <!-- FILTER HEADER -->

            <div class="filter-header">

                <h5>
                    FILTERS
                </h5>

                <button
                    type="button"
                    id="clearAllFilters"
                >
                    CLEAR ALL
                </button>

            </div>



            

            <!-- =================================================
                 PRICE
            ================================================== -->

            <div class="filter-section">

                <div class="filter-title">

                    <span>
                        Price
                    </span>

                    <i class="bi bi-chevron-up"></i>

                </div>


                <div class="filter-content">


                    <div class="price-inputs">

                        <input
                            type="number"
                            id="minPrice"
                            placeholder="Min"
                            min="0"
                        >

                        <span>
                            —
                        </span>

                        <input
                            type="number"
                            id="maxPrice"
                            placeholder="Max"
                            min="0"
                        >

                    </div>


                    <button
                        type="button"
                        id="applyPrice"
                        class="apply-filter-btn"
                    >
                        APPLY
                    </button>


                    <label class="filter-option">

                        <input
                            type="radio"
                            name="priceRange"
                            value="0-500"
                        >

                        <span>
                            Under ₹500
                        </span>

                    </label>


                    <label class="filter-option">

                        <input
                            type="radio"
                            name="priceRange"
                            value="500-1000"
                        >

                        <span>
                            ₹500 - ₹1,000
                        </span>

                    </label>


                    <label class="filter-option">

                        <input
                            type="radio"
                            name="priceRange"
                            value="1000-1500"
                        >

                        <span>
                            ₹1,000 - ₹1,500
                        </span>

                    </label>


                    <label class="filter-option">

                        <input
                            type="radio"
                            name="priceRange"
                            value="1500-999999"
                        >

                        <span>
                            ₹1,500+
                        </span>

                    </label>

                </div>

            </div>



            <!-- =================================================
                 COLOR
            ================================================== -->

            <div class="filter-section">

                <div class="filter-title">

                    <span>
                        Color
                    </span>

                    <i class="bi bi-chevron-up"></i>

                </div>


                <div class="filter-content color-filter-content">


                    <label class="color-option">

                        <input
                            type="checkbox"
                            class="color-filter"
                            value="Black"
                        >

                        <span class="color-circle black"></span>

                        <span>
                            Black
                        </span>

                    </label>


                    <label class="color-option">

                        <input
                            type="checkbox"
                            class="color-filter"
                            value="White"
                        >

                        <span class="color-circle white"></span>

                        <span>
                            White
                        </span>

                    </label>


                    <label class="color-option">

                        <input
                            type="checkbox"
                            class="color-filter"
                            value="Blue"
                        >

                        <span class="color-circle blue"></span>

                        <span>
                            Blue
                        </span>

                    </label>


                    <label class="color-option">

                        <input
                            type="checkbox"
                            class="color-filter"
                            value="Grey"
                        >

                        <span class="color-circle grey"></span>

                        <span>
                            Grey
                        </span>

                    </label>


                    <label class="color-option">

                        <input
                            type="checkbox"
                            class="color-filter"
                            value="Green"
                        >

                        <span class="color-circle green"></span>

                        <span>
                            Green
                        </span>

                    </label>


                    <label class="color-option">

                        <input
                            type="checkbox"
                            class="color-filter"
                            value="Navy Blue"
                        >

                        <span class="color-circle navy"></span>

                        <span>
                            Navy Blue
                        </span>

                    </label>

                </div>

            </div>



            

            
        </aside>



        <!-- =====================================================
             PRODUCTS AREA
        ====================================================== -->

        <main class="products-area">


            <!-- SORT TOOLBAR -->

            <div class="sort-toolbar">


                <!-- ACTIVE FILTERS -->

                <div
                    class="active-filters"
                    id="activeFilters"
                ></div>


                <!-- SORT -->

                <div class="sort-wrapper">

                    <label for="sortProducts">
                        Sort by:
                    </label>


                    <select
                        id="sortProducts"
                    >

                        <option value="recommended">
                            Recommended
                        </option>

                        <option value="new">
                            What's New
                        </option>

                        <option value="popularity">
                            Popularity
                        </option>

                        <option value="discount">
                            Better Discount
                        </option>

                        <option value="price-high">
                            Price: High to Low
                        </option>

                        <option value="price-low">
                            Price: Low to High
                        </option>

                        <option value="rating">
                            Customer Rating
                        </option>

                    </select>

                </div>

            </div>



            <!-- =================================================
                 PRODUCT GRID

                 IMPORTANT:
                 fashion-men.js MUST render products here.
            ================================================== -->

            <div
                id="fashionProducts"
                class="fashion-product-grid"
            ></div>



            <!-- =================================================
                 NO PRODUCTS
            ================================================== -->

            <div
                id="noProducts"
                class="no-products d-none"
            >

                <div class="no-products-icon">

                    <i class="bi bi-search"></i>

                </div>


                <h3>
                    No products found
                </h3>


                <p>
                    Try changing your search or filters.
                </p>


                <button
                    type="button"
                    id="resetNoProducts"
                    class="localmart-green-btn"
                >

                    CLEAR FILTERS

                </button>

            </div>

        </main>

    </div>

</div>



<!-- =========================================================
     LOCALMART FOOTER
========================================================= -->

{% include "fashion-shared-footer.html" %}



<!-- =========================================================
     BOOTSTRAP JS
========================================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>



<!-- =========================================================
     FASHION MEN JS
========================================================= -->

<script src="{% static 'js/fashion-shared.js' %}"></script>

<script
    src="{% static 'js/fashion-men.js' %}"
></script>


</body>

</html>
