{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1">

<title>Create Account | LocalMart</title>


<!-- Bootstrap -->

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">


<!-- Bootstrap Icons -->

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet">


<!-- Login / Signup CSS -->

<link
    rel="stylesheet"
    href="{% static 'css/login.css' %}">


</head>

<body class="customer-signup-page">
<div class="container-fluid">
    <div class="row min-vh-100">
        <div class="col-lg-6 left-panel d-none d-lg-flex">
            <div class="overlay">
                <div class="content">
                    <img src="{% static 'images/signup.jpg' %}" class="img-fluid rounded-4 shadow" alt="LocalMart Signup">
                    <h1>Create Your Account</h1>
                    <p>Sign up to shop from your favourite local stores.</p>
                </div>
            </div>
        </div>

        <div class="col-lg-6 d-flex justify-content-center customer-signup-form-column">
            <div class="login-box">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-success"><i class="bi bi-shop"></i> LocalMart</h2>
                    <p class="text-muted">Create your account</p>
                </div>


<form id="signupForm">

    <div class="mb-3">
        <label for="full_name" class="form-label">Full Name</label>
        <input
            type="text"
            class="form-control"
            id="full_name"
            name="full_name"
            placeholder="Enter your full name"
            maxlength="150"
            required>
    </div>

    <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input
            type="email"
            class="form-control"
            id="email"
            name="email"
            placeholder="Enter your email"
            required>
    </div>

    <div class="mb-3">
        <label for="mobile" class="form-label">Mobile Number</label>
        <input
            type="text"
            class="form-control"
            id="mobile"
            name="mobile"
            inputmode="numeric"
            placeholder="Enter mobile number"
            required>
    </div>

    <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <div class="input-group">
            <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                placeholder="Create password"
                required>

            <button
                type="button"
                class="btn btn-outline-secondary"
                onclick="togglePassword('password', 'eye1')">

                <i class="bi bi-eye" id="eye1"></i>
            </button>
        </div>
    </div>

    <div class="mb-3">
        <label for="confirm_password" class="form-label">
            Confirm Password
        </label>
        <div class="input-group">
            <input
                type="password"
                class="form-control"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm password"
                required>

            <button
                type="button"
                class="btn btn-outline-secondary"
                onclick="togglePassword('confirm_password', 'eye2')">

                <i class="bi bi-eye" id="eye2"></i>
            </button>
        </div>
    </div>

    <div class="mb-3">
        <label>Password Strength</label>

        <div class="progress">
            <div
                id="strengthBar"
                class="progress-bar"
                style="width: 0%;">
            </div>
        </div>

        <small id="strengthText" class="text-muted"></small>
    </div>

    <div class="form-check mb-3">
        <input
            class="form-check-input"
            type="checkbox"
            id="terms"
            required>

        <label class="form-check-label" for="terms">
            I agree to the Terms & Conditions
        </label>
    </div>

    <div id="signupMessage"></div>

    <button
        type="submit"
        class="btn btn-success w-100 py-2">

        <i class="bi bi-person-plus-fill"></i>
        Create Account

    </button>

</form>


            <!-- DIVIDER -->

            <div class="divider">

                <span>OR</span>

            </div>


            <!-- GOOGLE -->

            <a
    href="{% url 'google_login' %}"
    class="btn btn-light border w-100 mb-3 d-flex align-items-center justify-content-center gap-2">

    <img
        src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg"
        width="20"
        height="20"
        alt="Google">

    Continue with Google

</a>


            <!-- LOGIN LINK -->

            <div class="text-center mt-4">

                Already have an account?

                <a href="{% url 'login' %}" class="text-success fw-bold">
    Login
</a>

            </div>


            <!-- BACK TO HOME -->

            <div class="text-center mt-4">

                <a
                    href="{% url 'index' %}"
                    class="text-success fw-bold text-decoration-none">

                    <i class="bi bi-arrow-left"></i>

                    Back to Home

                </a>

            </div>


            </div>
        </div>
    </div>
</div>

<!-- SIGNUP JAVASCRIPT -->

<script src="{% static 'js/signup.js' %}"></script>

<!-- BOOTSTRAP JAVASCRIPT -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
