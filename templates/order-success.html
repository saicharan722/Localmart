{% load static %}

<!DOCTYPE html>

<html>

<head>

    <title>Order Successful | LocalMart</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

</head>

<body>

<div class="container py-5">

    <div class="card border-0 shadow text-center mx-auto"
         style="max-width:600px;">

        <div class="card-body p-5">

            <i
                class="bi bi-check-circle-fill text-success"
                style="font-size:80px;">
            </i>

            <h2 class="fw-bold mt-4">

                Payment Successful!

            </h2>

            <p class="text-muted">

                Your LocalMart order has been placed successfully.

            </p>

            <a
                href="{% url 'shopping_my_orders' %}"
                class="btn btn-success px-4">

                <i class="bi bi-bag-check me-2"></i>

                View My Orders

            </a>

            {% if tracked_order %}
            <a href="{% url 'customer_tracking' tracked_order.id %}" class="btn btn-success px-4 ms-2">
                <i class="bi bi-geo-alt me-2"></i>Track Live Order
            </a>
            {% endif %}

            <a
                href="{% url 'food' %}"
                class="btn btn-outline-success px-4 ms-2">

                Continue Shopping

            </a>

        </div>

    </div>

</div>

</body>

</html>
