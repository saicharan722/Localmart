{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Restaurant Menu | LocalMart</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">

<link rel="stylesheet"
href="{% static 'css/restaurant-menu.css' %}">

</head>

<body>
<nav class="navbar navbar-light bg-white shadow-sm sticky-top">

<div class="container">

<a href="{% url 'food' %}"
class="navbar-brand">

<i class="bi bi-arrow-left"></i>

Back

</a>

<h5 class="m-0 fw-bold">

Restaurant Menu

</h5>

<button class="btn btn-success" onclick="goToCart()">
    <i class="bi bi-cart3"></i>
    <span id="cartCount">0</span>
</button>

</div>

</nav>

<section class="restaurant-header">

<img
id="restaurantImage"
class="banner-img">

<div class="overlay">

<div class="container">

<h1 id="restaurantName"></h1>

<p id="restaurantCuisine"></p>

<div class="restaurant-meta">

<span id="restaurantRating"></span>

<span id="restaurantTime"></span>

<span id="restaurantDistance"></span>

</div>

</div>

</div>

</section>

<section class="container mt-4">

<div class="offer-box">

🔥 Flat 50% OFF

Use Coupon

<b>LOCAL50</b>

</div>

</section>


<section class="container mt-4">

<input

id="menuSearch"

class="form-control"

placeholder="Search dishes...">

</section>





<section class="container mt-4">

<div
class="row g-4"
id="menuContainer">

</div>

</section>




{% include "partials/home-footer.html" %}


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="{% static 'js/cuisineMenus.js' %}"></script>
<script src="{% static 'js/restaurant-menu.js' %}?v=restaurant-cart-link-1"></script>

</body>

</html>
