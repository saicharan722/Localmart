<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check your email | LocalMart Merchant</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f8f5;color:#243228;font:15px/1.55 Arial,sans-serif}.card-reset{width:min(100%,480px);padding:40px;background:#fff;border:1px solid #e7eee8;border-radius:20px;box-shadow:0 18px 50px #1d3c2512;text-align:center}.check{width:58px;height:58px;display:grid;place-items:center;margin:0 auto 18px;border-radius:50%;background:#e9f7ed;color:#148541;font-size:30px}.card-reset h1{font-size:25px;font-weight:800}.card-reset p{color:#66746a}.brand{display:block;margin-bottom:28px;color:#198754;font-size:24px;font-weight:800}.brand span{color:#26352a}.button{display:inline-block;margin-top:12px;padding:12px 20px;border-radius:10px;background:#14a94a;color:#fff;text-decoration:none;font-weight:700}</style>
</head>
<body><main class="card-reset"><span class="brand">Local<span>Mart</span></span><div class="check" aria-hidden="true">✓</div><h1>Check your email</h1><p>{{ message }}</p><p>If the address is registered, the reset link will arrive shortly. Check your spam folder too.</p><a class="button" href="{% url 'merchant_login' %}">Back to Merchant Login</a></main></body>
</html>
